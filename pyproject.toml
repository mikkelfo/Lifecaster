[build-system]
requires = ["setuptools<81"]
build-backend = "setuptools.build_meta"

[project]
name = "Lifecaster"
version = "1.0.0"
requires-python = ">=3.12"
authors = [
   { name = "Mikkel Odgaard", email="miod@di.ku.dk" },
   { name = "Magnus Lindgaard Nielsen" },
   { name = "Louis Boucherie" },
]
dependencies = [
   "setuptools==80.0.0",
   "numpy", # 2.5.1
   "polars==1.29",
   "pyarrow", # 24.0.0
   "torch==2.7.0",
   "lightning==2.2.5",
   "zstandard", # 0.25.0
   "lmdb", # 2.2.1
   "tqdm", # 4.68.4
   "hydra-core", # 1.3.4
   "tensorboard", # 2.21.0
]

[project.optional-dependencies]
data = [
   "pandas",
   "oracledb",
   "sqlalchemy",
]
dev = [
   "matplotlib",
   "ipykernel",
]
flash-attn = [
   #"packaging", # Already installed
   "psutil", # 7.2.2
   "ninja", # 1.13.0
   #"flash-attn", # 2.8.3 # Install via `MAX_JOBS=8 pip install flash-attn --no-build-isolation
]


[tool.setuptools.packages.find]
where = ["src", "src.*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["lifecaster"]
